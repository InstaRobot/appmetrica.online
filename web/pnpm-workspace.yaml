  - fumadocs-openapi@12.4.2
  - fumadocs-ui@16.17.2
  - lucide-react@1.56.0
  - orval@8.42.0
  - postcss@8.5.30
  - radix-ui@1.8.1
# Патчи зависимостей (pnpm patch). fumadocs-openapi: aria-label у селекторов тела запроса,
# авторизации и ответа API reference (combobox без имени нарушает WCAG 4.1.2, axe button-name).
patchedDependencies:
  fumadocs-openapi@12.4.2: patches/fumadocs-openapi@12.4.2.patch
