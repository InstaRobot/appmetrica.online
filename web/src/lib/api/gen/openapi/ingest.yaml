openapi: 3.0.3
info:
  title: appmetrica.online Ingestion API
  version: 1.1.0
  description: |
    Accepts system events from apps without an SDK.
    Authentication: the app's public write key `pk_…` in the `X-App-Key` header
    or in the `app_key` body field (for navigator.sendBeacon). Keys in the query string are rejected.
    A 200 response is returned only after the write to storage is confirmed.
servers:
  - url: https://i.appmetrica.online
    description: Production
  - url: http://localhost:8081
    description: Local development
tags:
  - name: Ingestion
    description: Event batch ingestion
  - name: Health
    description: Liveness and readiness
paths:
  /v1/events:
    options:
      tags: [Ingestion]
      operationId: preflightEvents
      summary: CORS preflight for browser clients
      security: []
      responses:
        '204':
          description: Preflight accepted
          headers:
            Access-Control-Allow-Origin: { $ref: '#/components/headers/AccessControlAllowOrigin' }
            Access-Control-Allow-Methods:
              schema: { type: string, example: 'POST, OPTIONS' }
            Access-Control-Allow-Headers:
              schema: { type: string, example: 'Content-Type, Content-Encoding, X-App-Key' }
            Access-Control-Max-Age:
              schema: { type: integer, example: 86400 }
    post:
      tags: [Ingestion]
      operationId: ingestEvents
      summary: Ingest a batch of events (1..500)
      description: |
        Validates, enriches (geo, default context) and writes the events.
        Invalid events do not fail the batch: they are listed in `rejected`.
        The whole batch is rejected only on batch-level errors (400/401/403/413/415/429/503).
      security:
        - appKeyHeader: []
        - {}
      parameters:
        - $ref: '#/components/parameters/ContentEncoding'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventBatch' }
            examples:
              ios_session: { $ref: '#/components/examples/IosSessionBatch' }
          text/plain:
            schema: { $ref: '#/components/schemas/EventBatch' }
            examples:
              web_beacon: { $ref: '#/components/examples/WebBeaconBatch' }
      responses:
        '200':
          description: Batch processed (may be a partial success)
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            Access-Control-Allow-Origin: { $ref: '#/components/headers/AccessControlAllowOrigin' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestResult' }
              examples:
                all_accepted: { $ref: '#/components/examples/ResultAllAccepted' }
                partial: { $ref: '#/components/examples/ResultPartial' }
        '400':
          description: Invalid batch
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                invalid_json: { $ref: '#/components/examples/ErrInvalidJson' }
                invalid_batch: { $ref: '#/components/examples/ErrInvalidBatch' }
                unsupported_content_encoding: { $ref: '#/components/examples/ErrUnsupportedEncoding' }
        '401':
          description: Key is missing, unknown or revoked
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                missing_app_key: { $ref: '#/components/examples/ErrMissingKey' }
                invalid_app_key: { $ref: '#/components/examples/ErrInvalidKey' }
        '403':
          description: App is archived
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                app_archived: { $ref: '#/components/examples/ErrAppArchived' }
        '413':
          description: Body exceeds 1,048,576 bytes after decompression
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                payload_too_large: { $ref: '#/components/examples/ErrPayloadTooLarge' }
        '415':
          description: Content-Type is neither application/json nor text/plain
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                unsupported_media_type: { $ref: '#/components/examples/ErrUnsupportedMediaType' }
        '429':
          description: App event rate limit exceeded
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                app_rate_limited: { $ref: '#/components/examples/ErrAppRateLimited' }
        '500':
          description: Internal error
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                internal_error: { $ref: '#/components/examples/ErrInternal' }
        '503':
          description: Storage unavailable; retry the whole batch
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                storage_unavailable: { $ref: '#/components/examples/ErrStorageUnavailable' }
  /health:
    get:
      tags: [Health]
      operationId: ingestHealth
      summary: Liveness (dependencies are not checked)
      security: []
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
  /ready:
    get:
      tags: [Health]
      operationId: ingestReady
      summary: Readiness (ClickHouse, Postgres, key cache loaded)
      security: []
      responses:
        '200':
          description: Ready to accept events
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadyStatus' }
        '503':
          description: Not ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadyStatus' }
components:
  securitySchemes:
    appKeyHeader:
      type: apiKey
      in: header
      name: X-App-Key
      description: Public app write key, `pk_` followed by 32 base62 characters. Alternatively, pass it in the `app_key` body field.
  parameters:
    ContentEncoding:
      name: Content-Encoding
      in: header
      required: false
      schema: { type: string, enum: [gzip, identity] }
  headers:
    RetryAfter:
      description: Seconds to wait before retrying the request
      schema: { type: integer, minimum: 1 }
    XRequestId:
      description: Request ULID; matches error.request_id and the server logs
      schema: { type: string }
    AccessControlAllowOrigin:
      schema: { type: string, enum: ['*'] }
  schemas:
    Platform:
      type: string
      enum: [ios, android, web, macos, windows, linux, bot, server, other]
    DeviceType:
      type: string
      enum: [phone, tablet, desktop, tv, watch, server, unknown]
    Environment:
      type: string
      enum: [production, development]
    EventName:
      type: string
      enum: [session_start, session_end]
    EventContext:
      type: object
      additionalProperties: false
      description: |
        Device context. The event's `context` overrides the batch `context` field by field.
        A missing `platform` is taken from the key's platform, then from the app's only platform;
        otherwise it is `other` with a `platform_missing` warning. A missing `environment` means production.
      properties:
        platform: { $ref: '#/components/schemas/Platform' }
        os_name: { type: string, maxLength: 32, example: iOS }
        os_version: { type: string, maxLength: 32, example: 26.0.1 }
        app_version: { type: string, maxLength: 64, example: 3.4.0 }
        app_build: { type: string, maxLength: 64, example: '341' }
        device_model: { type: string, maxLength: 64, example: 'iPhone17,3' }
        device_type: { $ref: '#/components/schemas/DeviceType' }
        locale: { type: string, maxLength: 35, description: BCP 47, example: ru-RU }
        environment: { $ref: '#/components/schemas/Environment' }
        ip:
          type: string
          maxLength: 45
          description: |
            Server-to-server sources only: the user's IPv4/IPv6 address for geo lookup, or the string "none"
            to disable geo. Used for the lookup and never stored.
          example: none
    Event:
      type: object
      additionalProperties: false
      required: [insert_id, name, timestamp, install_id, session_id]
      properties:
        insert_id:
          type: string
          format: uuid
          description: Unique event ID used to deduplicate retries
        name: { $ref: '#/components/schemas/EventName' }
        timestamp:
          type: string
          format: date-time
          description: Event time by the device clock, RFC 3339 with offset
        install_id:
          type: string
          format: uuid
          description: Stable install ID; must not be the nil UUID
        session_id:
          type: string
          format: uuid
          description: Shared by session_start and session_end of the same session
        user_id:
          type: string
          minLength: 1
          maxLength: 128
          description: Opaque user ID from the app's backend. Emails, phone numbers and strings containing U+0000 are rejected.
        duration_ms:
          type: integer
          format: int64
          minimum: 0
          maximum: 86400000
          description: Required for session_end; time spent in the foreground
        context: { $ref: '#/components/schemas/EventContext' }
    EventBatch:
      type: object
      additionalProperties: false
      required: [sent_at, events]
      properties:
        app_key:
          type: string
          pattern: '^pk_[A-Za-z0-9]{32}$'
          description: Alternative to the X-App-Key header (for sendBeacon)
        sent_at:
          type: string
          format: date-time
          description: When the HTTP request was sent, by the device clock; used to correct clock skew
        context: { $ref: '#/components/schemas/EventContext' }
        events:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/Event' }
    RejectionCode:
      type: string
      enum:
        - missing_field
        - invalid_field
        - unknown_event_name
        - event_too_old
        - user_id_looks_like_pii
        - duration_required
        - install_rate_limited
    WarningCode:
      type: string
      enum:
        - timestamp_in_future_clamped
        - duplicate_insert_id_in_batch
        - geo_ip_invalid
        - platform_missing
    Rejection:
      type: object
      required: [index, insert_id, code, field, message, retryable]
      properties:
        index: { type: integer, minimum: 0 }
        insert_id: { type: string, nullable: true }
        code: { $ref: '#/components/schemas/RejectionCode' }
        field: { type: string, example: 'events[1].duration_ms' }
        message: { type: string }
        retryable:
          type: boolean
          description: true only for install_rate_limited
    IngestWarning:
      type: object
      required: [index, code, message]
      properties:
        index: { type: integer, minimum: 0 }
        code: { $ref: '#/components/schemas/WarningCode' }
        message: { type: string }
    IngestResult:
      type: object
      required: [accepted, rejected, warnings, server_time]
      properties:
        accepted: { type: integer, minimum: 0 }
        rejected:
          type: array
          items: { $ref: '#/components/schemas/Rejection' }
        warnings:
          type: array
          items: { $ref: '#/components/schemas/IngestWarning' }
        server_time: { type: string, format: date-time }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string }
            details:
              type: object
              additionalProperties: true
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }
    ReadyStatus:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ready, not_ready] }
        checks:
          type: object
          additionalProperties: { type: string, enum: [ok, fail] }
          example: { clickhouse: ok, postgres: ok, key_cache: ok }
  examples:
    IosSessionBatch:
      summary: 'iOS: session start and end for a signed-in user'
      value:
        sent_at: '2026-10-13T09:15:02.120Z'
        context:
          platform: ios
          os_name: iOS
          os_version: 26.0.1
          app_version: 3.4.0
          app_build: '341'
          device_model: 'iPhone17,3'
          device_type: phone
          locale: ru-RU
          environment: production
        events:
          - insert_id: 0199d6a1-7c2e-7b1a-9f00-3c1d2e4f5a61
            name: session_start
            timestamp: '2026-10-13T09:11:58.004Z'
            install_id: 6f1c2a9e-3b7d-4c55-8a2e-0d9b1f7e4c21
            session_id: 0199d6a1-7b90-7e3c-8d11-5a6b7c8d9e0f
            user_id: a3f9c2d1-77b4-4e0a-9c1e-2b5d8f6e1a90
          - insert_id: 0199d6a4-5d6e-7f80-9a1b-2c3d4e5f6a7b
            name: session_end
            timestamp: '2026-10-13T09:15:01.990Z'
            install_id: 6f1c2a9e-3b7d-4c55-8a2e-0d9b1f7e4c21
            session_id: 0199d6a1-7b90-7e3c-8d11-5a6b7c8d9e0f
            user_id: a3f9c2d1-77b4-4e0a-9c1e-2b5d8f6e1a90
            duration_ms: 183986
    WebBeaconBatch:
      summary: 'Web: sendBeacon (text/plain) with the key in the body'
      value:
        app_key: pk_7Hq2x9AbLm3Nc8Rt5Vw1Yz4Kd6Fg0Jp2
        sent_at: '2026-10-13T09:20:00.500+03:00'
        context:
          platform: web
          os_name: macOS
          device_type: desktop
          locale: ru-RU
        events:
          - insert_id: 0199d6b9-0a0b-7c0d-8e0f-101112131415
            name: session_end
            timestamp: '2026-10-13T09:20:00.480+03:00'
            install_id: 9b2e4c61-0f3a-4d8b-9e71-5c2a6d8f0b13
            session_id: 0199d6b0-1f2e-7d3c-8b4a-596877665544
            duration_ms: 412300
    ResultAllAccepted:
      value:
        accepted: 2
        rejected: []
        warnings: []
        server_time: '2026-10-13T09:15:02.318Z'
    ResultPartial:
      summary: One example of each RejectionCode and WarningCode
      value:
        accepted: 1
        rejected:
          - { index: 1, insert_id: null, code: missing_field, field: 'events[1].insert_id', message: 'Field insert_id is required.', retryable: false }
          - { index: 2, insert_id: 0199d6c1-0000-7000-8000-000000000002, code: invalid_field, field: 'events[2].install_id', message: 'install_id must be a UUID other than the nil UUID.', retryable: false }
          - { index: 3, insert_id: 0199d6c1-0000-7000-8000-000000000003, code: unknown_event_name, field: 'events[3].name', message: 'Allowed names: session_start, session_end.', retryable: false }
          - { index: 4, insert_id: 0199d6c1-0000-7000-8000-000000000004, code: event_too_old, field: 'events[4].timestamp', message: 'Event is older than 7 days after clock correction.', retryable: false }
          - { index: 5, insert_id: 0199d6c1-0000-7000-8000-000000000005, code: user_id_looks_like_pii, field: 'events[5].user_id', message: 'user_id looks like an email or a phone number. Send an opaque ID.', retryable: false }
          - { index: 6, insert_id: 0199d6c1-0000-7000-8000-000000000006, code: duration_required, field: 'events[6].duration_ms', message: 'session_end requires duration_ms (0..86400000).', retryable: false }
          - { index: 7, insert_id: 0199d6c1-0000-7000-8000-000000000007, code: install_rate_limited, field: 'events[7].install_id', message: 'Too many events from this device. Retry later.', retryable: true }
        warnings:
          - { index: 0, code: timestamp_in_future_clamped, message: 'Event time is more than 10 minutes in the future; replaced with the receive time.' }
          - { index: 8, code: duplicate_insert_id_in_batch, message: 'insert_id is repeated within the batch; the event was skipped.' }
          - { index: 0, code: geo_ip_invalid, message: 'context.ip is not an IP address; geo was not resolved.' }
        server_time: '2026-10-13T09:15:02.318Z'
    ErrInvalidJson:
      value: { error: { code: invalid_json, message: 'Request body is not valid JSON.', request_id: 01JA8Z3K7Q2M9V4T6R1X5N8C0B } }
    ErrInvalidBatch:
      value: { error: { code: invalid_batch, message: 'events: 1 to 500 events.', request_id: 01JA8Z3K7Q2M9V4T6R1X5N8C0C, details: { field: events, issue: max_items } } }
    ErrUnsupportedEncoding:
      value: { error: { code: unsupported_content_encoding, message: 'Only Content-Encoding: gzip is supported.', request_id: 01JA8Z3K7Q2M9V4T6R1X5N8C0D } }
    ErrMissingKey:
      value: { error: { code: missing_app_key, message: 'Pass the key in the X-App-Key header or the app_key field.', request_id: 01JA8Z3K7Q2M9V4T6R1X5N8C0E } }
    ErrInvalidKey:
      value: { error: { code: invalid_app_key, message: 'Key not found or revoked.', request_id: 01JA8Z3K7Q2M9V4T6R1X5N8C0F } }
    ErrAppArchived:
      value: { error: { code: app_archived, message: 'App is archived; event ingestion is stopped.', request_id: 01JA8Z3K7Q2M9V4T6R1X5N8C0G } }
    ErrPayloadTooLarge:
      value: { error: { code: payload_too_large, message: 'Decompressed body exceeds 1,048,576 bytes. Split the batch.', request_id: 01JA8Z3K7Q2M9V4T6R1X5N8C0H } }
    ErrUnsupportedMediaType:
      value: { error: { code: unsupported_media_type, message: 'Content-Type must be application/json or text/plain.', request_id: 01JA8Z3K7Q2M9V4T6R1X5N8C0J } }
    ErrAppRateLimited:
      value: { error: { code: app_rate_limited, message: 'App rate limit of 2000 events/s exceeded.', request_id: 01JA8Z3K7Q2M9V4T6R1X5N8C0K } }
    ErrInternal:
      value: { error: { code: internal_error, message: 'Internal error. Retry the batch later.', request_id: 01JA8Z3K7Q2M9V4T6R1X5N8C0M } }
    ErrStorageUnavailable:
      value: { error: { code: storage_unavailable, message: 'Storage is temporarily unavailable. Retry the whole batch.', request_id: 01JA8Z3K7Q2M9V4T6R1X5N8C0N } }
