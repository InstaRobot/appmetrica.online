# Dokploy → Project «appmetrica» → Compose «clickhouse-stack» (тип Docker Compose, источник Git,
# Compose Path: deploy/clickhouse/compose.yaml). Переменные задаются во вкладке Environment Dokploy
# (пишутся в .env рядом с файлом и подставляются через ${VAR}).
# Образы закреплены тегом и digest (проверено 2026-10-13). Обновление — сменой обоих значений.
services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.25.14@sha256:dd81097e2c38827a438287d8ae5d4dc8afafbdd0e61e83376fdd7ed4580673b9
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: appmetrica
      CLICKHOUSE_USER: appmetrica_admin
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      CLICKHOUSE_RW_PASSWORD: ${CLICKHOUSE_RW_PASSWORD}
      CLICKHOUSE_RO_PASSWORD: ${CLICKHOUSE_RO_PASSWORD}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
      - ./config.d/appmetrica.xml:/etc/clickhouse-server/config.d/appmetrica.xml:ro
      - ./users.d/appmetrica.xml:/etc/clickhouse-server/users.d/appmetrica.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user appmetrica_admin --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      dokploy-network:
        aliases:
          - clickhouse

  clickhouse-backup:
    image: altinity/clickhouse-backup:2.8.1@sha256:08016b048f7e6035c048501315c2a788e5a782f15f168e042c7bd48d5a388cc4
    restart: unless-stopped
    # Режим server + watch: инкрементальный бэкап каждые WATCH_INTERVAL, полный каждые FULL_INTERVAL,
    # REST API на :7171 (worker читает /backup/list/remote для проверки свежести).
    command: ["server", "--watch"]
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "9000"
      CLICKHOUSE_USERNAME: ${CLICKHOUSE_USERNAME}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD}
      REMOTE_STORAGE: s3
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION}
      BACKUPS_TO_KEEP_REMOTE: ${BACKUPS_TO_KEEP_REMOTE}
      WATCH_INTERVAL: ${WATCH_INTERVAL}
      FULL_INTERVAL: ${FULL_INTERVAL}
      API_LISTEN: 0.0.0.0:7171
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ../clickhouse-backup/config.yml:/etc/clickhouse-backup/config.yml:ro
    networks:
      dokploy-network:
        aliases:
          - clickhouse-backup

volumes:
  clickhouse-data:
  clickhouse-logs:

networks:
  dokploy-network:
    external: true
