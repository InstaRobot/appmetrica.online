name: Geo DB refresh

# Пересобирает образ backend с базой DB-IP City Lite текущего месяца и деплоит только ingest (api и
# worker гео-базу не используют). Тег образа — <sha main>-geo-YYYYMM, чтобы не перезаписывать <sha>
# обычного деплоя. Только ручной запуск: gh workflow run geo-refresh.yml — для установок на отдельных
# приложениях Dokploy. Прод appmetrica.online (Dokploy Compose) обновляет гео-базу через GEO_MONTH в
# Environment (README, «Deploying with Dokploy»).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build backend with fresh DB-IP
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main

      # Только текущий месяц: если DB-IP ещё не опубликовал файл, запуск падает (без тихого отката на старую базу).
      - name: Resolve DB-IP month (dbip-city-lite-YYYY-MM.mmdb.gz)
        id: geo
        run: GEO_STRICT=1 bash scripts/geo-month.sh >> "$GITHUB_OUTPUT"

      - name: Resolve image tag
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
          GEO_MONTH: ${{ steps.geo.outputs.geo_month }}
        run: |
          {
            echo "owner=${OWNER,,}"
            echo "tag=$(git rev-parse HEAD)-geo-${GEO_MONTH//-/}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7.4.0
        with:
          context: backend
          push: true
          provenance: false
          build-args: |
            GEO_MONTH=${{ steps.geo.outputs.geo_month }}
            VERSION=${{ steps.meta.outputs.tag }}
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/appmetrica-backend:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  deploy:
    needs: build
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ needs.build.outputs.tag }}
      services: "ingest"
    secrets: inherit
