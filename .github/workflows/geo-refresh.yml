name: Geo DB refresh

# Ежемесячно (2-го числа, 06:00 UTC) пересобирает образ backend со свежей базой DB-IP City Lite
# и деплоит только ingest (api и worker гео-базу не используют).

on:
  schedule:
    - cron: "0 6 2 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      backend_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main

      - name: Resolve tag and DB-IP month
        id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          month="$(date -u +%Y-%m)"
          curl -fsSI "https://download.db-ip.com/free/dbip-city-lite-${month}.mmdb.gz" >/dev/null
          {
            echo "owner=${owner}"
            echo "geo_month=${month}"
            echo "tag=$(git rev-parse HEAD)-geo-${month//-/}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7.4.0
        with:
          context: backend
          push: true
          build-args: |
            GEO_MONTH=${{ steps.meta.outputs.geo_month }}
            VERSION=${{ steps.meta.outputs.tag }}
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/appmetrica-backend:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  deploy:
    needs: build
    uses: ./.github/workflows/deploy.yml
    with:
      backend_tag: ${{ needs.build.outputs.backend_tag }}
      web_tag: ""
      services: "ingest"
    secrets: inherit
