name: Deploy

# Сборка образов и деплой в Dokploy (Hetzner AX102-1) через Tailscale и Dokploy API (T-024, 12-dev-runbook.md §9).
# Порядок: api (выполняет миграции при старте) → ingest → worker → web; первая ошибка останавливает выкатку.
# Запуск:
#   - автоматически после зелёного CI на main — сборка <sha> и деплой всех сервисов;
#   - gh workflow run deploy.yml -f ref=<sha|ветка>   — собрать образы из ref и выкатить;
#   - gh workflow run deploy.yml -f tag=<prev-sha>    — откат: выкатить готовые образы без сборки;
#   - -f services=api,ingest — только часть сервисов (по умолчанию все).
# Ручные шаги в Dokploy, Tailscale и секреты GitHub — deploy/dokploy/README.md.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref или sha: собрать образы и выкатить (взаимоисключающе с tag)"
        required: false
        default: ""
      tag:
        description: "Готовый тег образов в GHCR (<sha> или <sha>-geo-YYYYMM): выкатить без сборки, откат"
        required: false
        default: ""
      services:
        description: "Сервисы через запятую: api,ingest,worker,web"
        required: false
        default: "api,ingest,worker,web"
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""
      tag:
        type: string
        required: false
        default: ""
      services:
        type: string
        required: false
        default: "api,ingest,worker,web"

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  plan:
    name: plan (ref/tag → образы и сервисы)
    # Автодеплой — только зелёный CI по push в main (PR из форка с веткой main тоже приходит как workflow_run).
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.plan.outputs.build }}
      build_backend: ${{ steps.plan.outputs.build_backend }}
      build_web: ${{ steps.plan.outputs.build_web }}
      sha: ${{ steps.plan.outputs.sha }}
      tag: ${{ steps.plan.outputs.tag }}
      tag_main: ${{ steps.plan.outputs.tag_main }}
      services: ${{ steps.plan.outputs.services }}
      backend_image: ${{ steps.plan.outputs.backend_image }}
      web_image: ${{ steps.plan.outputs.web_image }}
      backend_main_image: ${{ steps.plan.outputs.backend_main_image }}
      web_main_image: ${{ steps.plan.outputs.web_main_image }}
    steps:
      # Скрипты деплоя всегда берутся из ветки по умолчанию, ref нужен только для git rev-parse.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve build, tag and services
        id: plan
        env:
          OWNER: ${{ github.repository_owner }}
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REF: ${{ inputs.ref }}
          TAG: ${{ inputs.tag }}
          SERVICES: ${{ inputs.services }}
        run: bash scripts/deploy-plan.sh | tee -a "$GITHUB_OUTPUT"

  build:
    name: build & push images (GHCR)
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          path: src

      # Текущий месяц DB-IP City Lite, если файл уже опубликован, иначе предыдущий; имя файла — в логе шага.
      - name: Resolve DB-IP month (GEO_MONTH)
        id: geo
        run: bash scripts/geo-month.sh >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # provenance: false — одна версия пакета GHCR на образ, ретеншн job prune считает версии как теги.
      - name: Backend image (ingest / api / worker)
        if: needs.plan.outputs.build_backend == 'true'
        uses: docker/build-push-action@v7.4.0
        with:
          context: src/backend
          push: true
          provenance: false
          build-args: |
            GEO_MONTH=${{ steps.geo.outputs.geo_month }}
            VERSION=${{ needs.plan.outputs.sha }}
          tags: |
            ${{ needs.plan.outputs.backend_image }}
            ${{ needs.plan.outputs.backend_main_image }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Web image
        if: needs.plan.outputs.build_web == 'true'
        uses: docker/build-push-action@v7.4.0
        with:
          context: src/web
          push: true
          provenance: false
          build-args: |
            API_INTERNAL_URL=http://appmetrica-api:8080
            NEXT_PUBLIC_INGEST_URL=https://i.appmetrica.online
            NEXT_PUBLIC_API_URL=https://api.appmetrica.online
          tags: |
            ${{ needs.plan.outputs.web_image }}
            ${{ needs.plan.outputs.web_main_image }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: deploy (Dokploy via Tailscale)
    needs: [plan, build]
    # build пропускается при откате по tag — тогда деплой идёт сразу после plan.
    if: >-
      !cancelled() && needs.plan.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      SERVICES: ${{ needs.plan.outputs.services }}
      BACKEND_IMAGE: ${{ needs.plan.outputs.backend_image }}
      WEB_IMAGE: ${{ needs.plan.outputs.web_image }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Откат на тег, которого уже нет в GHCR (ретеншн 10 версий), падает здесь, а не посреди выкатки.
      - name: Check images exist in GHCR
        run: |
          if [[ ",$SERVICES," =~ ,(api|ingest|worker), ]]; then docker buildx imagetools inspect "$BACKEND_IMAGE" >/dev/null && echo "есть: $BACKEND_IMAGE"; fi
          if [[ ",$SERVICES," == *,web,* ]]; then docker buildx imagetools inspect "$WEB_IMAGE" >/dev/null && echo "есть: $WEB_IMAGE"; fi

      - name: Connect to tailnet (Dokploy panel is reachable only via Tailscale)
        uses: tailscale/github-action@v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy services (api → ingest → worker → web)
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APP_ID_API: ${{ secrets.DOKPLOY_APP_ID_API }}
          DOKPLOY_APP_ID_INGEST: ${{ secrets.DOKPLOY_APP_ID_INGEST }}
          DOKPLOY_APP_ID_WORKER: ${{ secrets.DOKPLOY_APP_ID_WORKER }}
          DOKPLOY_APP_ID_WEB: ${{ secrets.DOKPLOY_APP_ID_WEB }}
          GHCR_PULL_USER: ${{ secrets.GHCR_PULL_USER }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          DEPLOY_TITLE: deploy ${{ needs.plan.outputs.tag }} run ${{ github.run_id }}-${{ github.run_attempt }}
        run: bash scripts/dokploy-deploy.sh

      - name: Smoke (/health ingest и api, web)
        run: |
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors https://i.appmetrica.online/health && echo
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors https://api.appmetrica.online/health && echo
          if [[ ",$SERVICES," == *,web,* ]]; then
            code=$(curl -sS -o /dev/null -w '%{http_code}' https://appmetrica.online/)
            echo "web: GET / → $code"
            [[ "$code" == 200 || "$code" == 307 ]]
          fi

  prune:
    name: prune GHCR (10 последних версий)
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      packages: write
    steps:
      - uses: actions/delete-package-versions@v5.0.0
        with:
          package-name: appmetrica-backend
          package-type: container
          min-versions-to-keep: 10

      - uses: actions/delete-package-versions@v5.0.0
        with:
          package-name: appmetrica-web
          package-type: container
          min-versions-to-keep: 10
