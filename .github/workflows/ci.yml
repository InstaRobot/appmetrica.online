name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.21.0"
  GOLANGCI_LINT_VERSION: "v2.14.0"

jobs:
  backend:
    name: backend (lint, generated code, tests, coverage)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Generated Go code is up to date (oapi-codegen + sqlc)
        run: |
          go tool oapi-codegen -config oapi-ingest.cfg.yaml ../contracts/openapi/ingest.yaml
          go tool oapi-codegen -config oapi-api.cfg.yaml ../contracts/openapi/api.yaml
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD":/src -w /src sqlc/sqlc:1.31.1 generate
          git diff --exit-code -- internal/gen internal/pgstore/sqlc

      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: backend

      - name: Unit tests (race)
        run: go test -race -count=1 ./...

      - name: Integration tests + coverage gate (testcontainers, ≥80% for ingest/reports/auth/identity/deletion)
        working-directory: .
        run: make coverage

  web:
    name: web (biome, types, unit tests, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Generated TS client is up to date (orval)
        run: |
          pnpm gen:api
          git diff --exit-code -- src/lib/api/gen

      - run: pnpm biome ci .
      - run: pnpm typecheck
      - run: pnpm test:coverage

      - name: Production build
        env:
          API_INTERNAL_URL: http://localhost:8080
          NEXT_PUBLIC_INGEST_URL: http://localhost:8081
          NEXT_PUBLIC_API_URL: http://localhost:8080
        run: pnpm build

  e2e:
    name: e2e (Playwright against real ingest + api + ClickHouse + Postgres)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Infrastructure (ClickHouse 26.8, Postgres 18.6), migrations, geo-db
        run: |
          cp .env.example .env
          make dev-infra
          make migrate-up
          make geo-db

      - name: Start ingest and api
        run: |
          set -a; source .env; set +a
          cd backend
          go build -o ../bin/appmetrica ./cmd/appmetrica
          METRICS_LISTEN_ADDR=:9091 CLICKHOUSE_USER=appmetrica_rw CLICKHOUSE_PASSWORD="$CLICKHOUSE_RW_PASSWORD" ../bin/appmetrica ingest > ../ingest.log 2>&1 &
          METRICS_LISTEN_ADDR=:9092 CLICKHOUSE_USER=appmetrica_ro CLICKHOUSE_PASSWORD="$CLICKHOUSE_RO_PASSWORD" ../bin/appmetrica api > ../api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/ready >/dev/null && curl -fsS http://localhost:8081/ready >/dev/null; then echo "backend ready"; exit 0; fi
            sleep 1
          done
          echo "backend did not become ready"; cat ../api.log ../ingest.log; exit 1

      - name: Install web deps and Playwright Chromium
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Build web and run E2E
        working-directory: web
        env:
          API_INTERNAL_URL: http://localhost:8080
          NEXT_PUBLIC_INGEST_URL: http://localhost:8081
          NEXT_PUBLIC_API_URL: http://localhost:8080
        run: |
          set -a; source ../.env; set +a
          pnpm build
          pnpm e2e

      - name: Upload Playwright report and backend logs
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-artifacts
          path: |
            web/playwright-report
            web/test-results
            ingest.log
            api.log
          retention-days: 7

  images:
    name: build & push images (GHCR)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [backend, web, e2e]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Resolve image owner and DB-IP month
        id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          month="$(date -u +%Y-%m)"
          if ! curl -fsSI "https://download.db-ip.com/free/dbip-city-lite-${month}.mmdb.gz" >/dev/null; then
            month="$(date -u -d '1 month ago' +%Y-%m)"
          fi
          echo "owner=${owner}" >> "$GITHUB_OUTPUT"
          echo "geo_month=${month}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend image (ingest / api / worker)
        uses: docker/build-push-action@v7.4.0
        with:
          context: backend
          push: true
          build-args: |
            GEO_MONTH=${{ steps.meta.outputs.geo_month }}
            VERSION=${{ github.sha }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/appmetrica-backend:${{ github.sha }}
            ghcr.io/${{ steps.meta.outputs.owner }}/appmetrica-backend:main
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Web image
        uses: docker/build-push-action@v7.4.0
        with:
          context: web
          push: true
          build-args: |
            API_INTERNAL_URL=http://appmetrica-api:8080
            NEXT_PUBLIC_INGEST_URL=https://i.appmetrica.online
            NEXT_PUBLIC_API_URL=https://api.appmetrica.online
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/appmetrica-web:${{ github.sha }}
            ghcr.io/${{ steps.meta.outputs.owner }}/appmetrica-web:main
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
