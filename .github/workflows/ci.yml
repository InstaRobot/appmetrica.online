name: CI

# Гейты 22-test-strategy.md §5 (T-008). Все jobs обязательны в branch protection для main.
# Образы собирает и выкатывает deploy.yml после зелёного CI на main (T-024).
# Jobs backend, web, gen-check, tdd-order и e2e идут параллельно, чтобы весь прогон укладывался в ~10 минут.
# Перф-тест отчётов (job perf-reports, NFR-003, T-035) — еженедельно по cron, вручную и по метке perf на PR;
# cron и ручной запуск прогоняют и остальные jobs на main (деплой запускает только push, см. deploy.yml).

on:
  push:
    branches: [main]
  pull_request:
    # labeled/unlabeled — чтобы метка tdd-exception сразу пересчитывала job tdd-order.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # event_name в группе: push в main не отменяет еженедельный перф-прогон.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.21.0"
  GOLANGCI_LINT_VERSION: "v2.14.0"
  GOVULNCHECK_VERSION: "v1.9.0"

jobs:
  gen-check:
    name: gen-check (oapi-codegen, sqlc, orval)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: web

      - name: Generated code is committed and up to date
        run: make gen-check

  tdd-order:
    name: tdd-order (test commit before implementation)
    # Метку tdd-exception ставит только владелец (hotfix, 22-test-strategy.md §8.1); с ней job пропускается.
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'tdd-exception')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check TDD commit order against the PR base
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          if ! out="$(bash scripts/check-tdd-order.sh "$BASE_REF")"; then
            printf '%s\n' "$out"
            { echo '### TDD order violations'; echo '```'; printf '%s\n' "$out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=TDD order::Тест пакета закоммичен позже реализации. Разделите коммиты или запросите метку tdd-exception."
            exit 1
          fi
          printf '%s\n' "$out"

  backend:
    name: backend (lint, tests, coverage, govulncheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: CI gate scripts (coverage-gate, check-tdd-order)
        working-directory: .
        run: bash scripts/test-ci-gates.sh

      - name: Deploy scripts and workflows (deploy-plan, dokploy-deploy, geo-month)
        working-directory: .
        run: bash scripts/test-deploy.sh

      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: backend

      # -tags=integration включает и unit-тесты: один прогон с -race даёт и результат, и профиль покрытия.
      - name: Unit + integration tests (race, testcontainers) and coverage gate (≥80% ingest/reports/auth/identity/deletion)
        working-directory: .
        shell: bash # явный shell включает pipefail: падение make не теряется за tee
        run: make coverage | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Fuzz PII guard (30s)
        working-directory: .
        run: make fuzz

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }} ./...

  web:
    name: web (biome, types, unit tests, audit, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm biome ci .
      - run: pnpm typecheck
      # Пороги покрытия (lines/statements/functions ≥ 70 %, branches ≥ 60 %) — в vitest.config.ts.
      - run: pnpm test:coverage
      - name: Dependency audit (high and critical)
        run: pnpm audit --prod --audit-level high

      - name: Production build
        env:
          API_INTERNAL_URL: http://localhost:8080
          NEXT_PUBLIC_INGEST_URL: http://localhost:8081
          NEXT_PUBLIC_API_URL: http://localhost:8080
        run: pnpm build

  e2e:
    name: e2e (Playwright against real ingest + api + ClickHouse + Postgres)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Infrastructure (ClickHouse 26.8, Postgres 18.6), migrations, geo-db
        run: |
          cp .env.example .env
          make dev-infra
          make migrate-up
          make geo-db

      - name: Start ingest and api
        run: |
          set -a; source .env; set +a
          cd backend
          go build -o ../bin/appmetrica ./cmd/appmetrica
          METRICS_LISTEN_ADDR=:9091 CLICKHOUSE_USER=appmetrica_rw CLICKHOUSE_PASSWORD="$CLICKHOUSE_RW_PASSWORD" ../bin/appmetrica ingest > ../ingest.log 2>&1 &
          METRICS_LISTEN_ADDR=:9092 CLICKHOUSE_USER=appmetrica_ro CLICKHOUSE_PASSWORD="$CLICKHOUSE_RO_PASSWORD" ../bin/appmetrica api > ../api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/ready >/dev/null && curl -fsS http://localhost:8081/ready >/dev/null; then echo "backend ready"; exit 0; fi
            sleep 1
          done
          echo "backend did not become ready"; cat ../api.log ../ingest.log; exit 1

      - name: Install web deps and Playwright Chromium
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Build web and run E2E
        working-directory: web
        env:
          API_INTERNAL_URL: http://localhost:8080
          NEXT_PUBLIC_INGEST_URL: http://localhost:8081
          NEXT_PUBLIC_API_URL: http://localhost:8080
        run: |
          set -a; source ../.env; set +a
          pnpm build
          pnpm e2e

      - name: Upload Playwright report and backend logs
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-artifacts
          path: |
            web/playwright-report
            web/test-results
            ingest.log
            api.log
          retention-days: 7

  perf-reports:
    name: perf-reports (NFR-003, 100k DAU × 90 days)
    # 22-test-strategy.md §11.2: еженедельно, по метке perf на PR и вручную — обязательно перед снятием AppMetrica SDK.
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'perf'))
    # ubuntu-24.04: 4 vCPU и 16 ГБ RAM — окружение AC-035.1.
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Reports P95 on synthetic data (testcontainers ClickHouse) and EXPLAIN partition pruning
        run: make perf-reports

      - name: Results to job summary
        if: always()
        run: |
          f=backend/perf/reports/reports-latest.json
          [ -f "$f" ] || exit 0
          {
            echo '### Reports perf (P95 of 20 runs)'
            echo '| report | P50, ms | P95, ms | threshold, ms | pass |'
            echo '|---|---:|---:|---:|:-:|'
            jq -r '.results[] | "| \(.name) | \(.p50_ms | floor) | \(.p95_ms | floor) | \(.threshold_ms | floor) | \(if .pass then "✅" else "❌" end) |"' "$f"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports-latest.json
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: reports-perf
          path: backend/perf/reports/reports-latest.json
          if-no-files-found: ignore
          retention-days: 90
