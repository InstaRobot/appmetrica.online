# sqlc 1.31.1 (запуск: `make gen-sqlc`, образ sqlc/sqlc:1.31.1)
# Схема читается из goose-миграций (секции -- +goose Down игнорируются).
version: "2"
sql:
  - engine: postgresql
    schema: migrations/postgres
    queries: queries/postgres
    gen:
      go:
        package: sqlc
        out: internal/pgstore/sqlc
        sql_package: pgx/v5
        emit_interface: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        emit_enum_valid_method: true
        emit_all_enum_values: true
        overrides:
          - db_type: uuid
            go_type:
              import: github.com/google/uuid
              type: UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type:
              import: time
              type: Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          - db_type: jsonb
            go_type:
              import: encoding/json
              type: RawMessage
