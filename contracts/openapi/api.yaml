              schema: { $ref: '#/components/schemas/DeletionRequestList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
components:
  securitySchemes:
    bearerApiKey:
      type: http
      scheme: bearer
      bearerFormat: 'sk_ + 40 base62'
      description: Read API key. The scope an operation requires is given in x-required-scope (read | delete).
    sessionCookie:
      type: apiKey
      in: cookie
      name: am_session
      description: Dashboard session after a passkey sign-in. Mutating requests require X-Requested-With.
  parameters:
    AppId:
      name: app_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    KeyId:
      name: key_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    SetupToken:
      name: token
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
    From:
      name: from
      in: query
      required: true
      schema: { type: string, format: date }
    To:
      name: to
      in: query
      required: true
      schema: { type: string, format: date }
    Compare:
      name: compare
      in: query
      schema: { type: string, enum: [previous_period, none], default: previous_period }
    Split:
      name: split
      in: query
      description: 'platform: one series per platform seen in the period, next to the total (TimeSeries.splits); compare is then ignored.'
      schema: { type: string, enum: [none, platform], default: none }
    EnvironmentQ:
      name: environment
      in: query
      schema: { $ref: '#/components/schemas/Environment' }
    UnitQ:
      name: unit
      in: query
      schema: { $ref: '#/components/schemas/Unit' }
    IncludeArchived:
      name: include_archived
      in: query
      schema: { type: boolean, default: false }
    FilterPlatform:
      name: platform
      in: query
      style: form
      explode: true
      schema:
        type: array
        items: { $ref: '#/components/schemas/Platform' }
    FilterAppVersion:
      name: app_version
      in: query
      style: form
      explode: true
      schema:
        type: array
        items: { type: string, maxLength: 64 }
    FilterOsName:
      name: os_name
      in: query
      style: form
      explode: true
      schema:
        type: array
        items: { type: string, maxLength: 32 }
    FilterCountry:
      name: country
      in: query
      style: form
      explode: true
      schema:
        type: array
        items: { type: string, pattern: '^[A-Z]{2}$' }
    XRequestedWith:
      name: X-Requested-With
      in: header
      required: true
      description: CSRF protection for cookie-authenticated requests
      schema: { type: string, enum: [appmetrica-web] }
  headers:
    RetryAfter:
      schema: { type: integer, minimum: 1 }
    SetSessionCookie:
      description: am_session=<token>; Path=/; HttpOnly; Secure; SameSite=Lax; Max-Age=2592000
      schema: { type: string }
    ClearSessionCookie:
      description: am_session=; Path=/; Max-Age=0; HttpOnly; Secure; SameSite=Lax
      schema: { type: string }
  responses:
    BadRequest:
      description: invalid_request | range_too_large
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthenticated:
      description: unauthenticated
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: insufficient_scope | csrf_check_failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: app_not_found | profile_not_found | not_found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: last_passkey | app_name_taken | confirm_name_mismatch | deletion_pending | merge_in_progress | app_archived
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Gone:
      description: setup_token_expired
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    WebAuthnFailed:
      description: webauthn_verification_failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: rate_limited
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    StorageUnavailable:
      description: storage_unavailable
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Platform:
      type: string
      enum: [ios, android, web, macos, windows, linux, bot, server, other]
    PlatformList:
      type: array
      minItems: 1
      maxItems: 9
      uniqueItems: true
      items: { $ref: '#/components/schemas/Platform' }
    Environment:
      type: string
      enum: [production, development]
      default: production
    Unit:
      type: string
      enum: [persons, installs]
      default: persons
    AppStatus:
      type: string
      enum: [active, archived]
    Granularity:
      type: string
      enum: [hour, day, week, month]
      default: day
    TimeSeriesMetric:
      type: string
      enum: [active, new, sessions, avg_duration_ms]
      default: active
    BreakdownDimension:
      type: string
      enum: [platform, os_name, os_version, app_version, device_model, device_type, country, city, locale]
    BreakdownMetric:
      type: string
      enum: [active, new, sessions]
      default: active
    CohortGranularity:
      type: string
      enum: [day, week]
      default: day
    DeletionSubjectType:
      type: string
      enum: [install, user, app]
    DeletionStatus:
      type: string
      enum: [pending, running, done, failed]
    DeletionSource:
      type: string
      enum: [api, dashboard]
    ApiKeyScope:
      type: string
      enum: [read, delete]
    AlertKey:
      type: string
      enum: [disk_free, insert_errors, backup_stale, ingest_down, api_down, clickhouse_down]
    JobName:
      type: string
      enum: [close_day, digest, system_check, deletion, session_cleanup, app_merge]
    JobStatus:
      type: string
      enum: [running, ok, failed]
    App:
      type: object
      required: [id, name, platform, platforms, timezone, status, created_at, updated_at, archived_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 64 }
        platform:
          allOf: [{ $ref: '#/components/schemas/Platform' }]
          deprecated: true
          description: 'Deprecated: the first platform in platforms. Will be removed in the next release.'
        platforms: { $ref: '#/components/schemas/PlatformList' }
        timezone: { type: string, example: Europe/Moscow }
        status: { $ref: '#/components/schemas/AppStatus' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        archived_at: { type: string, format: date-time, nullable: true }
    AppSummary:
      type: object
      required: [id, name, platform, platforms, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        platform:
          allOf: [{ $ref: '#/components/schemas/Platform' }]
          deprecated: true
          description: 'Deprecated: the first platform in platforms. Will be removed in the next release.'
        platforms: { $ref: '#/components/schemas/PlatformList' }
        status: { $ref: '#/components/schemas/AppStatus' }
    AppList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/App' }
    SparklinePoint:
      type: object
      required: [day, active]
      properties:
        day: { type: string, format: date }
        active: { type: integer, format: int64 }
    PortfolioRow:
      type: object
      required: [app, active_today, active_date, active_same_day_prev_week, active_delta_pct, new_date, sessions_date, retention_d1, retention_d7, sparkline, platforms]
      properties:
        app: { $ref: '#/components/schemas/AppSummary' }
        active_today: { type: integer, format: int64 }
        active_date: { type: integer, format: int64 }
        active_same_day_prev_week: { type: integer, format: int64 }
        active_delta_pct: { type: number, nullable: true }
        new_date: { type: integer, format: int64 }
        sessions_date: { type: integer, format: int64 }
        retention_d1: { type: number, minimum: 0, maximum: 1, nullable: true }
        retention_d7: { type: number, minimum: 0, maximum: 1, nullable: true }
        sparkline:
          type: array
          minItems: 30
          maxItems: 30
          items: { $ref: '#/components/schemas/SparklinePoint' }
        platforms:
          type: array
          description: |
            Active count for `date` by events.platform, sorted by active descending, then in enum order.
            A person on two platforms is counted in both rows, so the sum can exceed active_date.
          items: { $ref: '#/components/schemas/PlatformActive' }
    PlatformActive:
      type: object
      required: [platform, active]
      properties:
        platform: { type: string, description: 'events.platform; unknown values are kept' }
        active: { type: integer, format: int64, minimum: 0 }
    Portfolio:
      type: object
      required: [date, environment, unit, rows]
      properties:
        date: { type: string, format: date }
        environment: { $ref: '#/components/schemas/Environment' }
        unit: { $ref: '#/components/schemas/Unit' }
        rows:
          type: array
          items: { $ref: '#/components/schemas/PortfolioRow' }
    AudienceDelta:
      type: object
      required: [active, new, sessions, avg_duration_ms, median_duration_ms]
      properties:
        active: { type: number, nullable: true }
        new: { type: number, nullable: true }
        sessions: { type: number, nullable: true }
        avg_duration_ms: { type: number, nullable: true }
        median_duration_ms: { type: number, nullable: true }
    AudienceCompare:
      type: object
      required: [from, to, active, new, sessions, avg_duration_ms, median_duration_ms, delta_pct]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        active: { type: integer, format: int64 }
        new: { type: integer, format: int64 }
        sessions: { type: integer, format: int64 }
        avg_duration_ms: { type: number, nullable: true }
        median_duration_ms: { type: number, nullable: true }
        delta_pct: { $ref: '#/components/schemas/AudienceDelta' }
    AudienceSummary:
      type: object
      required: [from, to, active, new, sessions, avg_duration_ms, median_duration_ms]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        active: { type: integer, format: int64 }
        new: { type: integer, format: int64 }
        sessions: { type: integer, format: int64 }
        avg_duration_ms: { type: number, nullable: true }
        median_duration_ms: { type: number, nullable: true }
        compare: { $ref: '#/components/schemas/AudienceCompare' }
    TimeSeriesPoint:
      type: object
      required: [ts, value]
      properties:
        ts: { type: string, format: date-time, description: Bucket start with the app time zone offset }
        value: { type: number, nullable: true }
    TimeSeries:
      type: object
      required: [metric, granularity, points]
      properties:
        metric: { $ref: '#/components/schemas/TimeSeriesMetric' }
        granularity: { $ref: '#/components/schemas/Granularity' }
        points:
          type: array
          items: { $ref: '#/components/schemas/TimeSeriesPoint' }
        compare_points:
          type: array
          items: { $ref: '#/components/schemas/TimeSeriesPoint' }
        splits:
          type: array
          description: 'Only with split=platform: one series per observed platform; compare_points is then omitted.'
          items: { $ref: '#/components/schemas/TimeSeriesSplit' }
    TimeSeriesSplit:
      type: object
      required: [platform, points]
      properties:
        platform: { type: string, description: 'events.platform; unknown values are kept' }
        points:
          type: array
          items: { $ref: '#/components/schemas/TimeSeriesPoint' }
    RollingActivePoint:
      type: object
      required: [day, dau, wau, mau]
      properties:
        day: { type: string, format: date }
        dau: { type: integer, format: int64 }
        wau: { type: integer, format: int64 }
        mau: { type: integer, format: int64 }
    RollingActive:
      type: object
      required: [points]
      properties:
        points:
          type: array
          items: { $ref: '#/components/schemas/RollingActivePoint' }
    BreakdownRow:
      type: object
      required: [value, count, share]
      properties:
        value: { type: string, description: An empty string means the value is unknown }
        count: { type: integer, format: int64 }
        share: { type: number, minimum: 0, maximum: 1 }
    Breakdown:
      type: object
      required: [dimension, metric, total, rows]
      properties:
        dimension: { $ref: '#/components/schemas/BreakdownDimension' }
        metric: { $ref: '#/components/schemas/BreakdownMetric' }
        total: { type: integer, format: int64 }
        rows:
          type: array
          items: { $ref: '#/components/schemas/BreakdownRow' }
    RetentionCohort:
      type: object
      required: [cohort_start, size, values]
      properties:
        cohort_start: { type: string, format: date }
        size: { type: integer, format: int64 }
        values:
          type: array
          description: Length is periods+1 (D0..Dperiods); null means the period has not been reached yet
          items: { type: number, minimum: 0, maximum: 1, nullable: true }
    RetentionMatrix:
      type: object
      required: [cohort_granularity, periods, cohorts, average]
      properties:
        cohort_granularity: { $ref: '#/components/schemas/CohortGranularity' }
        periods: { type: integer }
        cohorts:
          type: array
          items: { $ref: '#/components/schemas/RetentionCohort' }
        average:
          type: array
          items: { type: number, minimum: 0, maximum: 1, nullable: true }
    RealtimeMinute:
      type: object
      required: [minute, sessions_started]
      properties:
        minute: { type: string, format: date-time }
        sessions_started: { type: integer, format: int64 }
    RecentEvent:
      type: object
      required: [insert_id, event_time, received_at, name, environment, platform, app_version, os_name, os_version, device_model, country, city, install_id, person_key]
      properties:
        insert_id: { type: string, format: uuid, description: 'Stable key of the feed row (React key, highlighting of new rows)' }
        event_time: { type: string, format: date-time }
        received_at: { type: string, format: date-time }
        name: { type: string, enum: [session_start, session_end] }
        environment: { $ref: '#/components/schemas/Environment' }
        platform: { type: string }
        app_version: { type: string }
        os_name: { type: string }
        os_version: { type: string }
        device_model: { type: string }
        country: { type: string }
        city: { type: string }
        install_id: { type: string, format: uuid }
        person_key: { type: string }
    Realtime:
      type: object
      required: [active_now, per_minute, recent_events, generated_at]
      properties:
        active_now: { type: integer, format: int64 }
        per_minute:
          type: array
          minItems: 30
          maxItems: 30
          items: { $ref: '#/components/schemas/RealtimeMinute' }
        recent_events:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/RecentEvent' }
        generated_at: { type: string, format: date-time }
    ProfileSummary:
      type: object
      required: [person_key, user_id, matched_by, installs_count, first_seen, last_seen]
      properties:
        person_key: { type: string }
        user_id: { type: string, nullable: true }
        matched_by: { type: string, enum: [install_id, user_id] }
        installs_count: { type: integer }
        first_seen: { type: string, format: date-time }
        last_seen: { type: string, format: date-time }
    ProfileSearchResult:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/ProfileSummary' }
    ProfileInstall:
      type: object
      required: [install_id, platform, os_name, os_version, app_version, device_model, device_type, locale, country, city, first_seen, last_seen]
      properties:
        install_id: { type: string, format: uuid }
        platform: { type: string }
        os_name: { type: string }
        os_version: { type: string }
        app_version: { type: string }
        device_model: { type: string }
        device_type: { type: string }
        locale: { type: string }
        country: { type: string }
        city: { type: string }
        first_seen: { type: string, format: date-time }
        last_seen: { type: string, format: date-time }
    ProfileSession:
      type: object
      required: [session_id, install_id, started_at, ended_at, duration_ms, app_version, platform, environment, country, city]
      properties:
        session_id: { type: string, format: uuid }
        install_id: { type: string, format: uuid }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time, nullable: true }
        duration_ms: { type: integer, format: int64, nullable: true }
        app_version: { type: string }
        platform: { type: string }
        environment: { $ref: '#/components/schemas/Environment' }
        country: { type: string }
        city: { type: string }
    Profile:
      type: object
      required: [person_key, user_id, first_seen, last_seen, installs, sessions, next_before]
      properties:
        person_key: { type: string }
        user_id: { type: string, nullable: true }
        first_seen: { type: string, format: date-time }
        last_seen: { type: string, format: date-time }
        installs:
          type: array
          items: { $ref: '#/components/schemas/ProfileInstall' }
        sessions:
          type: array
          items: { $ref: '#/components/schemas/ProfileSession' }
        next_before: { type: string, format: date-time, nullable: true }
    IntegrationHour:
      type: object
      required: [hour, accepted, rejected]
      properties:
        hour: { type: string, format: date-time }
        accepted: { type: integer, format: int64 }
        rejected: { type: integer, format: int64 }
    IntegrationReason:
      type: object
      required: [code, count, last_seen, example_payload, example_message]
      properties:
        code: { type: string, description: RejectionCode or an ingest batch error code }
        count: { type: integer, format: int64 }
        last_seen: { type: string, format: date-time }
        example_payload: { type: string, maxLength: 4096 }
        example_message: { type: string }
    IntegrationVersion:
      type: object
      required: [app_version, accepted, rejected, last_seen]
      properties:
        app_version: { type: string }
        accepted: { type: integer, format: int64 }
        rejected: { type: integer, format: int64 }
        last_seen: { type: string, format: date-time }
    IntegrationHealth:
      type: object
      required: [hours, first_event_at, accepted_total, rejected_total, hourly, reasons, versions]
      properties:
        hours: { type: integer }
        first_event_at: { type: string, format: date-time, nullable: true }
        accepted_total: { type: integer, format: int64 }
        rejected_total: { type: integer, format: int64 }
        hourly:
          type: array
          items: { $ref: '#/components/schemas/IntegrationHour' }
        reasons:
          type: array
          items: { $ref: '#/components/schemas/IntegrationReason' }
        versions:
          type: array
          items: { $ref: '#/components/schemas/IntegrationVersion' }
    CreateDeletionRequestBody:
      type: object
      additionalProperties: false
      required: [subject_type, subject_value]
      properties:
        subject_type: { type: string, enum: [install, user] }
        subject_value:
          type: string
          minLength: 1
          maxLength: 128
          description: 'For install, the install_id (UUID); for user, the user_id as in ingest (1..128 characters after trimming whitespace, no U+0000).'
    DeletionRequest:
      type: object
      required: [id, app_id, subject_type, subject_value, status, source, requested_at, started_at, completed_at, error]
      properties:
        id: { type: string, format: uuid }
        app_id: { type: string, format: uuid }
        subject_type: { $ref: '#/components/schemas/DeletionSubjectType' }
        subject_value: { type: string }
        status: { $ref: '#/components/schemas/DeletionStatus' }
        source: { $ref: '#/components/schemas/DeletionSource' }
        requested_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }
        error: { type: string, nullable: true }
    DeletionRequestList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/DeletionRequest' }
    AuthState:
      type: object
      required: [authenticated, setup_required]
      properties:
        authenticated: { type: boolean }
        setup_required: { type: boolean }
    WebAuthnCeremonyOptions:
      type: object
      required: [ceremony_id, options]
      properties:
        ceremony_id: { type: string, format: uuid }
        options:
          type: object
          additionalProperties: true
          description: |
            JSON from go-webauthn v0.18.2: {"publicKey": PublicKeyCredentialCreationOptionsJSON |
            PublicKeyCredentialRequestOptionsJSON, "mediation"?: "conditional"}. The frontend passes
            options.publicKey as optionsJSON to @simplewebauthn/browser 14.0.0.
    FinishLoginBody:
      type: object
      required: [ceremony_id, credential]
      properties:
        ceremony_id: { type: string, format: uuid }
        credential:
          type: object
          additionalProperties: true
          description: AuthenticationResponseJSON from startAuthentication()
    FinishRegistrationBody:
      type: object
      required: [ceremony_id, credential, name]
      properties:
        ceremony_id: { type: string, format: uuid }
        credential:
          type: object
          additionalProperties: true
          description: RegistrationResponseJSON from startRegistration()
        name: { type: string, minLength: 1, maxLength: 64 }
    Passkey:
      type: object
      required: [id, name, created_at, last_used_at, backup_eligible, backup_state, transports]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true }
        backup_eligible: { type: boolean }
        backup_state: { type: boolean }
        transports:
          type: array
          items: { type: string, enum: [usb, nfc, ble, smart-card, hybrid, internal] }
    PasskeyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Passkey' }
    RenamePasskeyBody:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
    CreateAppBody:
      type: object
      additionalProperties: false
      required: [name, platforms, timezone]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        platforms: { $ref: '#/components/schemas/PlatformList' }
        timezone: { type: string, description: IANA, example: Europe/Moscow }
    UpdateAppBody:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        timezone: { type: string }
        platforms: { $ref: '#/components/schemas/PlatformList' }
    DeleteAppBody:
      type: object
      additionalProperties: false
      required: [confirm_name]
      properties:
        confirm_name: { type: string }
    WriteKey:
      type: object
      required: [id, app_id, key, label, platform, created_at, revoked_at, last_used_at]
      properties:
        id: { type: string, format: uuid }
        app_id: { type: string, format: uuid }
        key: { type: string, pattern: '^pk_[A-Za-z0-9]{32}$' }
        label: { type: string, maxLength: 64 }
        platform:
          allOf: [{ $ref: '#/components/schemas/Platform' }]
          nullable: true
          description: Platform for events without context.platform; null means any platform.
        created_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time, nullable: true }
        last_used_at: { type: string, format: date-time, nullable: true }
    WriteKeyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/WriteKey' }
    AppMergeStatus:
      type: string
      enum: [pending, running, done, failed]
    AppMergeStep:
      type: string
      enum: [move_keys, wait_keys, copy, purge_source, reclose, done]
    AppMerge:
      type: object
      required: [id, target_app_id, source_app_id, source_name, source_platforms, status, step, copied_events, total_events, error, created_at, started_at, finished_at]
      properties:
        id: { type: string, format: uuid }
        target_app_id: { type: string, format: uuid }
        source_app_id: { type: string, format: uuid, nullable: true, description: 'null once the source app is deleted (the purge_source step)' }
        source_name: { type: string }
        source_platforms: { $ref: '#/components/schemas/PlatformList' }
        status: { $ref: '#/components/schemas/AppMergeStatus' }
        step: { $ref: '#/components/schemas/AppMergeStep' }
        copied_events: { type: integer, format: int64, minimum: 0 }
        total_events: { type: integer, format: int64, minimum: 0 }
        error: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
    AppMergeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AppMerge' }
    MergePreview:
      type: object
      required: [source, events, first_day, last_day, write_keys, timezone_differs, target_timezone, source_timezone]
      properties:
        source: { $ref: '#/components/schemas/AppSummary' }
        events: { type: integer, format: int64, minimum: 0 }
        first_day: { type: string, format: date, nullable: true, description: 'First day of the source events, in the source time zone' }
        last_day: { type: string, format: date, nullable: true }
        write_keys: { type: integer, minimum: 0, description: 'Active source keys; they move to the target app' }
        timezone_differs: { type: boolean }
        target_timezone: { type: string }
        source_timezone: { type: string }
    CreateAppMergeBody:
      type: object
      additionalProperties: false
      required: [source_app_id, confirm_name]
      properties:
        source_app_id: { type: string, format: uuid }
        confirm_name: { type: string, minLength: 1, maxLength: 64, description: 'Exact name of the source app' }
    CreateWriteKeyBody:
      type: object
      additionalProperties: false
      properties:
        label: { type: string, maxLength: 64, default: '' }
        platform:
          allOf: [{ $ref: '#/components/schemas/Platform' }]
          description: Platform for events without context.platform; omit it for any platform.
    CreateAppResult:
      type: object
      required: [app, write_keys]
      properties:
        app: { $ref: '#/components/schemas/App' }
        write_keys:
          type: array
          minItems: 1
          description: One key per app platform, in the order of platforms.
          items: { $ref: '#/components/schemas/WriteKey' }
    ApiKey:
      type: object
      required: [id, key_prefix, label, scopes, app_id, created_at, revoked_at, last_used_at]
      properties:
        id: { type: string, format: uuid }
        key_prefix: { type: string, pattern: '^sk_[A-Za-z0-9]{8}$' }
        label: { type: string }
        scopes:
          type: array
          items: { $ref: '#/components/schemas/ApiKeyScope' }
        app_id: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time, nullable: true }
        last_used_at: { type: string, format: date-time, nullable: true }
    ApiKeyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiKey' }
    CreateApiKeyBody:
      type: object
      additionalProperties: false
      required: [label, scopes]
      properties:
        label: { type: string, minLength: 1, maxLength: 64 }
        scopes:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items: { $ref: '#/components/schemas/ApiKeyScope' }
        app_id: { type: string, format: uuid, nullable: true }
    CreateApiKeyResult:
      type: object
      required: [api_key, secret]
      properties:
        api_key: { $ref: '#/components/schemas/ApiKey' }
        secret: { type: string, pattern: '^sk_[A-Za-z0-9]{40}$' }
    Settings:
      type: object
      required: [owner_timezone, telegram_chat_id, digest_enabled, digest_time, alerts_enabled, updated_at]
      properties:
        owner_timezone: { type: string }
        telegram_chat_id: { type: string, nullable: true }
        digest_enabled: { type: boolean }
        digest_time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        alerts_enabled: { type: boolean }
        updated_at: { type: string, format: date-time }
    UpdateSettingsBody:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        owner_timezone: { type: string }
        telegram_chat_id: { type: string, pattern: '^-?[0-9]{1,20}$', nullable: true }
        digest_enabled: { type: boolean }
        digest_time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        alerts_enabled: { type: boolean }
    TelegramTestResult:
      type: object
      required: [sent]
      properties:
        sent: { type: boolean }
        telegram_message_id: { type: integer, format: int64 }
        error: { type: string }
    AlertState:
      type: object
      required: [key, firing, first_fired_at, last_notified_at, last_value]
      properties:
        key: { $ref: '#/components/schemas/AlertKey' }
        firing: { type: boolean }
        first_fired_at: { type: string, format: date-time, nullable: true }
        last_notified_at: { type: string, format: date-time, nullable: true }
        last_value: { type: string }
    JobRun:
      type: object
      required: [id, job, started_at, finished_at, status, details]
      properties:
        id: { type: string, format: uuid }
        job: { $ref: '#/components/schemas/JobName' }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
        status: { $ref: '#/components/schemas/JobStatus' }
        details:
          type: object
          additionalProperties: true
    SystemStatus:
      type: object
      required: [clickhouse, postgres, backup, alerts, jobs]
      properties:
        clickhouse:
          type: object
          required: [ok, disk_free_pct, events_rows]
          properties:
            ok: { type: boolean }
            disk_free_pct: { type: number, nullable: true }
            events_rows: { type: integer, format: int64, nullable: true }
        postgres:
          type: object
          required: [ok]
          properties:
            ok: { type: boolean }
        backup:
          type: object
          required: [last_backup_at, last_backup_name]
          properties:
            last_backup_at: { type: string, format: date-time, nullable: true }
            last_backup_name: { type: string, nullable: true }
        alerts:
          type: array
          items: { $ref: '#/components/schemas/AlertState' }
        jobs:
          type: array
          items: { $ref: '#/components/schemas/JobRun' }
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }
    ReadyStatus:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ready, not_ready] }
        checks:
          type: object
          additionalProperties: { type: string, enum: [ok, fail] }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string }
            details:
              type: object
              additionalProperties: true
