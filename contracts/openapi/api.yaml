openapi: 3.0.3
info:
  title: appmetrica.online API
  version: 1.1.0
  description: |
    Read API (`/v1`, Bearer `sk_…` with the read/delete scopes, or the dashboard cookie)
    and the internal Admin API (`/admin/v1`, `am_session` cookie only, every operation is x-internal).
    Dates from/to/date are YYYY-MM-DD in the app time zone, inclusive.
    Any request body is limited to 65,536 bytes: a larger body gets 413 `payload_too_large` in the Error envelope
    (a global rule, like 500 `internal_error`; not listed per operation).
servers:
  - url: https://api.appmetrica.online
    description: 'Production: Read API for scripts (Bearer sk_)'
  - url: https://appmetrica.online/api
    description: 'Production: through the dashboard rewrites (am_session cookie)'
  - url: http://localhost:8080
    description: Local development
security:
  - bearerApiKey: []
  - sessionCookie: []
tags:
  - name: Apps
  - name: Portfolio
  - name: Audience
  - name: Retention
  - name: Realtime
  - name: Profiles
  - name: Integration
  - name: Deletion
  - name: Health
  - name: Admin Auth
    x-internal: true
  - name: Admin Passkeys
    x-internal: true
  - name: Admin Apps
    x-internal: true
  - name: Admin Keys
    x-internal: true
  - name: Admin Settings
    x-internal: true
  - name: Admin System
    x-internal: true
paths:
  /health:
    get:
      tags: [Health]
      operationId: apiHealth
      security: []
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
  /ready:
    get:
      tags: [Health]
      operationId: apiReady
      security: []
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadyStatus' }
        '503':
          description: Not ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadyStatus' }
  /v1/apps:
    get:
      tags: [Apps]
      operationId: listApps
      x-required-scope: read
      parameters:
        - $ref: '#/components/parameters/IncludeArchived'
      responses:
        '200':
          description: List of apps
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/apps/{app_id}:
    parameters:
      - $ref: '#/components/parameters/AppId'
    get:
      tags: [Apps]
      operationId: getApp
      x-required-scope: read
      responses:
        '200':
          description: App
          content:
            application/json:
              schema: { $ref: '#/components/schemas/App' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/portfolio:
    get:
      tags: [Portfolio]
      operationId: getPortfolio
      x-required-scope: read
      parameters:
        - name: date
          in: query
          required: false
          description: Defaults to yesterday in settings.owner_timezone
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/EnvironmentQ'
        - $ref: '#/components/parameters/UnitQ'
        - $ref: '#/components/parameters/IncludeArchived'
      responses:
        '200':
          description: Portfolio
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Portfolio' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }
  /v1/apps/{app_id}/audience/summary:
    parameters:
      - $ref: '#/components/parameters/AppId'
    get:
      tags: [Audience]
      operationId: getAudienceSummary
      x-required-scope: read
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Compare'
        - $ref: '#/components/parameters/EnvironmentQ'
        - $ref: '#/components/parameters/UnitQ'
        - $ref: '#/components/parameters/FilterPlatform'
        - $ref: '#/components/parameters/FilterAppVersion'
        - $ref: '#/components/parameters/FilterOsName'
        - $ref: '#/components/parameters/FilterCountry'
      responses:
        '200':
          description: Audience KPIs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AudienceSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }
  /v1/apps/{app_id}/audience/timeseries:
    parameters:
      - $ref: '#/components/parameters/AppId'
    get:
      tags: [Audience]
      operationId: getAudienceTimeseries
      x-required-scope: read
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: granularity
          in: query
          schema: { $ref: '#/components/schemas/Granularity' }
        - name: metric
          in: query
          schema: { $ref: '#/components/schemas/TimeSeriesMetric' }
        - $ref: '#/components/parameters/Compare'
        - $ref: '#/components/parameters/Split'
        - $ref: '#/components/parameters/EnvironmentQ'
        - $ref: '#/components/parameters/UnitQ'
        - $ref: '#/components/parameters/FilterPlatform'
        - $ref: '#/components/parameters/FilterAppVersion'
        - $ref: '#/components/parameters/FilterOsName'
        - $ref: '#/components/parameters/FilterCountry'
      responses:
        '200':
          description: Time series
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimeSeries' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }
  /v1/apps/{app_id}/audience/rolling-active:
    parameters:
      - $ref: '#/components/parameters/AppId'
    get:
      tags: [Audience]
      operationId: getRollingActive
      x-required-scope: read
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/EnvironmentQ'
        - $ref: '#/components/parameters/UnitQ'
        - $ref: '#/components/parameters/FilterPlatform'
        - $ref: '#/components/parameters/FilterAppVersion'
        - $ref: '#/components/parameters/FilterOsName'
        - $ref: '#/components/parameters/FilterCountry'
      responses:
        '200':
          description: Daily DAU/WAU/MAU
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RollingActive' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }
  /v1/apps/{app_id}/audience/breakdown:
    parameters:
      - $ref: '#/components/parameters/AppId'
    get:
      tags: [Audience]
      operationId: getAudienceBreakdown
      x-required-scope: read
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: dimension
          in: query
          required: true
          schema: { $ref: '#/components/schemas/BreakdownDimension' }
        - name: metric
          in: query
          schema: { $ref: '#/components/schemas/BreakdownMetric' }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - $ref: '#/components/parameters/EnvironmentQ'
        - $ref: '#/components/parameters/UnitQ'
        - $ref: '#/components/parameters/FilterPlatform'
        - $ref: '#/components/parameters/FilterAppVersion'
        - $ref: '#/components/parameters/FilterOsName'
        - $ref: '#/components/parameters/FilterCountry'
      responses:
        '200':
          description: Breakdown by dimension
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Breakdown' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }
  /v1/apps/{app_id}/retention:
    parameters:
      - $ref: '#/components/parameters/AppId'
    get:
      tags: [Retention]
      operationId: getRetention
      x-required-scope: read
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: cohort_granularity
          in: query
          schema: { $ref: '#/components/schemas/CohortGranularity' }
        - name: periods
          in: query
          description: day 1..90 (default 30), week 1..52 (default 12)
          schema: { type: integer, minimum: 1, maximum: 90 }
        - $ref: '#/components/parameters/EnvironmentQ'
        - $ref: '#/components/parameters/UnitQ'
        - $ref: '#/components/parameters/FilterPlatform'
        - $ref: '#/components/parameters/FilterAppVersion'
        - $ref: '#/components/parameters/FilterOsName'
        - $ref: '#/components/parameters/FilterCountry'
      responses:
        '200':
          description: Retention matrix
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RetentionMatrix' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }
  /v1/apps/{app_id}/realtime:
    parameters:
      - $ref: '#/components/parameters/AppId'
    get:
      tags: [Realtime]
      operationId: getRealtime
      x-required-scope: read
      description: >-
        A live snapshot: people with an open session, session starts over the last 30 minutes and the latest events.
        The platform filter narrows all three parts; other report filters do not apply.
      parameters:
        - $ref: '#/components/parameters/EnvironmentQ'
        - $ref: '#/components/parameters/FilterPlatform'
      responses:
        '200':
          description: Realtime snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Realtime' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }
  /v1/apps/{app_id}/profiles:
    parameters:
      - $ref: '#/components/parameters/AppId'
    get:
      tags: [Profiles]
      operationId: searchProfiles
      x-required-scope: read
      parameters:
        - name: q
          in: query
          required: true
          description: Exact install_id (UUID) or user_id
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: Matching profiles (up to 20)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileSearchResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }
  /v1/apps/{app_id}/profiles/{person_key}:
    parameters:
      - $ref: '#/components/parameters/AppId'
      - name: person_key
        in: path
        required: true
        description: u:<user_id> or i:<install_id>, URL-encoded
        schema: { type: string, pattern: '^(u:.{1,128}|i:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$' }
    get:
      tags: [Profiles]
      operationId: getProfile
      x-required-scope: read
      parameters:
        - name: sessions_limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: before
          in: query
          description: 'Cursor: started_at of the last session on the previous page (exclusive bound)'
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }
  /v1/apps/{app_id}/integration/health:
    parameters:
      - $ref: '#/components/parameters/AppId'
    get:
      tags: [Integration]
      operationId: getIntegrationHealth
      x-required-scope: read
      parameters:
        - name: hours
          in: query
          schema: { type: integer, minimum: 1, maximum: 168, default: 24 }
      responses:
        '200':
          description: Integration health
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationHealth' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }
  /v1/apps/{app_id}/deletion-requests:
    parameters:
      - $ref: '#/components/parameters/AppId'
    post:
      tags: [Deletion]
      operationId: createDeletionRequest
      x-required-scope: delete
      description: Idempotent on (app_id, subject_type, subject_value) among pending and running requests.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDeletionRequestBody' }
      responses:
        '202':
          description: Request accepted (a new one, or the existing pending or running one)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletionRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/apps/{app_id}/deletion-requests/{request_id}:
    parameters:
      - $ref: '#/components/parameters/AppId'
      - name: request_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Deletion]
      operationId: getDeletionRequest
      x-required-scope: read
      responses:
        '200':
          description: Deletion status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletionRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /admin/v1/auth/state:
    get:
      tags: [Admin Auth]
      operationId: getAuthState
      x-internal: true
      security: []
      responses:
        '200':
          description: Authentication state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthState' }
  /admin/v1/auth/login/begin:
    post:
      tags: [Admin Auth]
      operationId: beginLogin
      x-internal: true
      security: []
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      responses:
        '200':
          description: WebAuthn options for sign-in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebAuthnCeremonyOptions' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /admin/v1/auth/login/finish:
    post:
      tags: [Admin Auth]
      operationId: finishLogin
      x-internal: true
      security: []
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FinishLoginBody' }
      responses:
        '204':
          description: Signed in
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetSessionCookie' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/WebAuthnFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /admin/v1/auth/setup/{token}/begin:
    parameters:
      - $ref: '#/components/parameters/SetupToken'
    post:
      tags: [Admin Auth]
      operationId: beginSetup
      x-internal: true
      security: []
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      responses:
        '200':
          description: WebAuthn options for registration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebAuthnCeremonyOptions' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /admin/v1/auth/setup/{token}/finish:
    parameters:
      - $ref: '#/components/parameters/SetupToken'
    post:
      tags: [Admin Auth]
      operationId: finishSetup
      x-internal: true
      security: []
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FinishRegistrationBody' }
      responses:
        '204':
          description: Passkey registered, session created
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetSessionCookie' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
        '422': { $ref: '#/components/responses/WebAuthnFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /admin/v1/auth/logout:
    post:
      tags: [Admin Auth]
      operationId: logout
      x-internal: true
      security:
        - sessionCookie: []
        - {}
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      responses:
        '204':
          description: Session ended
          headers:
            Set-Cookie: { $ref: '#/components/headers/ClearSessionCookie' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/v1/passkeys:
    get:
      tags: [Admin Passkeys]
      operationId: listPasskeys
      x-internal: true
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Owner's passkeys
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasskeyList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /admin/v1/passkeys/register/begin:
    post:
      tags: [Admin Passkeys]
      operationId: beginPasskeyRegistration
      x-internal: true
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      responses:
        '200':
          description: WebAuthn options for registering an additional passkey
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebAuthnCeremonyOptions' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/v1/passkeys/register/finish:
    post:
      tags: [Admin Passkeys]
      operationId: finishPasskeyRegistration
      x-internal: true
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FinishRegistrationBody' }
      responses:
        '201':
          description: Passkey added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Passkey' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/WebAuthnFailed' }
  /admin/v1/passkeys/{passkey_id}:
    parameters:
      - name: passkey_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Admin Passkeys]
      operationId: renamePasskey
      x-internal: true
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RenamePasskeyBody' }
      responses:
        '200':
          description: Renamed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Passkey' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Admin Passkeys]
      operationId: deletePasskey
      x-internal: true
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      responses:
        '204':
          description: Deleted
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/v1/apps:
    post:
      tags: [Admin Apps]
      operationId: createApp
      x-internal: true
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAppBody' }
      responses:
        '201':
          description: App and the write keys for its platforms
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateAppResult' }
