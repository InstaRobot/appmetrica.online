# Локальная инфраструктура для разработки и интеграционных/E2E-тестов.
# Запуск: `make dev-infra` (docker compose -f docker-compose.dev.yml --env-file .env up -d --wait).
# Порты публикуются только на 127.0.0.1.
name: appmetrica-dev

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.25.14
    environment:
      CLICKHOUSE_DB: appmetrica
      CLICKHOUSE_USER: appmetrica_admin
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      CLICKHOUSE_RW_PASSWORD: ${CLICKHOUSE_RW_PASSWORD}
      CLICKHOUSE_RO_PASSWORD: ${CLICKHOUSE_RO_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:8123:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./deploy/clickhouse/config.d/appmetrica.xml:/etc/clickhouse-server/config.d/appmetrica.xml:ro
      - ./deploy/clickhouse/users.d/appmetrica.xml:/etc/clickhouse-server/users.d/appmetrica.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user appmetrica_admin --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1'"]
      interval: 3s
      timeout: 3s
      retries: 40

  postgres:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_USER: appmetrica
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: appmetrica
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18+: PGDATA = /var/lib/postgresql/18/docker, монтируем родительский каталог
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appmetrica -d appmetrica"]
      interval: 3s
      timeout: 3s
      retries: 40

volumes:
  clickhouse-data:
  postgres-data:
